name: Deploy site to GitHub Pages

# Builds the Docusaurus site in website/ and publishes it (served at https://atomsprout.com/nestvane/).
# The documents come from docs/: the build copies them in (website/scripts/sync-docs.mjs).

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A deployment in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages is not available while the repository is private, so this job is skipped until
    # it is public. After making it public, enable Pages in Settings -> Pages with "GitHub Actions"
    # as the source, then run this workflow.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
