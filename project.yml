name: nestvane
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
targets:
  nestvane:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: runtime
      - path: generated/AOT.cpp
      - path: generated/guests
        buildPhase: resources
      - path: generated/android17-init-root
        type: folder
        optional: true
        buildPhase: resources
      - path: generated/android17-art-root
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: libsqlite3.tbd
      - sdk: libAppleArchive.tbd
      - sdk: libresolv.tbd
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: Network.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
    info:
      path: generated/Info.plist
      properties:
        CFBundleDisplayName: nestvane
        NSCameraUsageDescription: Nestvane shares the cameras with Android apps when you use their camera.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Validation
                UISceneDelegateClassName: SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.validation
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/runtime"
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          GCC_OPTIMIZATION_LEVEL: "2"
  # Android from an image built with experiments/aosp/patch.py, with its code translated ahead of time
  # (tools/prepare-ios-native.sh) and run natively in place of the interpreter.
  nestvane-native:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: runtime
        excludes:
          - NoNativeCode.cpp
      - path: generated/AOT.cpp
      - path: generated/native-code/modules.c
        optional: true
      - path: generated/guests
        buildPhase: resources
      - path: generated/native-app/android17-init-root
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: libsqlite3.tbd
      - sdk: libAppleArchive.tbd
      - sdk: libresolv.tbd
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: Network.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - framework: generated/native-code/ios/lib/NestvaneCode0.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode1.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode2.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode3.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode4.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode5.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode6.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode7.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode8.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode9.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode10.framework
        embed: true
      - framework: generated/native-code/ios/lib/NestvaneCode11.framework
        embed: true
    info:
      path: generated/Info-native.plist
      properties:
        CFBundleDisplayName: Nestvane
        CFBundleName: Nestvane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # One window that fills the screen, upright: the Android display is laid out for that.
        UIRequiresFullScreen: true
        # An .apk in Files, AirDrop or a share sheet can be opened with the app, which installs it.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Android app package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.android.package-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android app package
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - apk
              public.mime-type:
                - application/vnd.android.package-archive
        # The app's Documents folder shows in the Files app: Documents/Android is the guest's shared storage.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # Without this an iPhone shows the app at 60 frames a second at most, whatever its screen can do.
        CADisableMinimumFrameDurationOnPhone: true
        # The menu of the app's icon on the home screen.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.atomsprout.nestvane.install-apk
            UIApplicationShortcutItemTitle: Install APK…
            UIApplicationShortcutItemIconSymbolName: square.and.arrow.down
        NSCameraUsageDescription: Nestvane shares the cameras with Android apps when you use their camera.
        NSMicrophoneUsageDescription: Nestvane lets Android apps hear the microphone while they record.
        NSLocalNetworkUsageDescription: Android apps in Nestvane reach devices on your local network, such as your router, when they ask to.
        UILaunchScreen: {}
        # Android's display turns with the device (GuestDisplayView in ios/App.mm).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Validation
                UISceneDelegateClassName: SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atomsprout.nestvane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "26"
        MARKETING_VERSION: "1.23"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/runtime"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) NESTVANE_PAGE_SIZE=16384 NESTVANE_NATIVE_DEFAULT=1"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/generated/native-code/ios/lib"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/generated/native-code/ios/lib"
        # The table of translated code and the guests' address spaces need more address space than
        # an app gets by default.
        CODE_SIGN_ENTITLEMENTS: ios/Native.entitlements
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          GCC_OPTIMIZATION_LEVEL: "2"
schemes:
  nestvane:
    build:
      targets:
        nestvane: all
    run:
      config: Release
  nestvane-native:
    build:
      targets:
        nestvane-native: all
    run:
      config: Release
