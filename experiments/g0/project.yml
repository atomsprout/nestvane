name: g0
options:
  deploymentTarget:
    iOS: "17.0"
settingGroups:
  app:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: arm64
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    OTHER_LDFLAGS: "-framework UIKit -framework Foundation"
targets:
  # Plain development entitlements.
  G0:
    type: application
    platform: iOS
    sources: [G0.mm]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0
  # Extended Virtual Addressing and Increased Memory Limit.
  G0Extended:
    type: application
    platform: iOS
    sources: [G0.mm]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0extended
        CODE_SIGN_ENTITLEMENTS: Extended.entitlements
  # Embeds the generated code frameworks for E5.
  G0Code:
    type: application
    platform: iOS
    sources: [G0.mm]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0code
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed generated code frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          for framework in "$G0_FRAMEWORKS"/G0Code*.framework; do
            rsync -a --delete "$framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none \
              "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/$(basename "$framework")"
          done
