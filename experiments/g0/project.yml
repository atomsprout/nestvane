name: g0
options:
  deploymentTarget:
    iOS: "26.0"
settingGroups:
  app:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: arm64
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    OTHER_LDFLAGS: "-framework UIKit -framework Foundation"
targets:
  # Plain development entitlements.
  G0:
    type: application
    platform: iOS
    sources: [G0.mm]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0
  # Extended Virtual Addressing and Increased Memory Limit.
  G0Extended:
    type: application
    platform: iOS
    sources: [G0.mm]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0extended
        CODE_SIGN_ENTITLEMENTS: Extended.entitlements
  # E3 on the device: the rewritten toybox and its runtime (run e3/build.sh first).
  G0Guest:
    type: application
    platform: iOS
    sources:
      - G0.mm
      - e3/runtime.c
      - e3/entry.S
      - path: ../../generated/g0/e3/toybox-hostlr.s
        optional: true
        buildPhase: sources
      - path: ../../generated/g0/e3/toybox.elf
        optional: true
        buildPhase: resources
      - path: ../../generated/g0/e3/scripts.bin
        optional: true
        buildPhase: resources
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0guest
        CODE_SIGN_ENTITLEMENTS: Extended.entitlements
        GCC_PREPROCESSOR_DEFINITIONS: "G0_GUEST=1 GUEST_MAIN=guest_main SEGMENT=(2ull<<30)"
  # The Bionic guest on the device: AOSP-built toybox, mksh, linker64 and libraries
  # (run e3/build-android.sh first).
  G0Android:
    type: application
    platform: iOS
    sources:
      - G0.mm
      - e3/runtime.c
      - e3/entry.S
      - path: ../../generated/g0/e3/android/obj
        optional: true
        excludes: ["*.o"]
      - path: ../../generated/g0/e3/android/root
        optional: true
        type: folder
        buildPhase: resources
      - path: ../../generated/g0/e3/android/scripts-android.bin
        optional: true
        buildPhase: resources
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0android
        CODE_SIGN_ENTITLEMENTS: Extended.entitlements
        GCC_PREPROCESSOR_DEFINITIONS: "G0_GUEST=1 G0_ANDROID=1 GUEST_MAIN=guest_main SEGMENT=(9ull<<30)"
  # The translated ART with its boot image (experiments/g0/e3/build_guest.py).
  G0Art:
    type: application
    platform: iOS
    sources:
      - G0.mm
      - e3/runtime.c
      - e3/entry.S
      - path: ../../generated/g0/e3/art/obj
        optional: true
        excludes: ["*.o"]
      - path: ../../generated/g0/e3/art/root
        optional: true
        type: folder
        buildPhase: resources
      - path: ../../generated/g0/e3/art/scripts-android.bin
        optional: true
        buildPhase: resources
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0art
        CODE_SIGN_ENTITLEMENTS: Extended.entitlements
        GCC_PREPROCESSOR_DEFINITIONS: "G0_GUEST=1 G0_ANDROID=1 GUEST_MAIN=guest_main SEGMENT=(16ull<<30)"
  # The same guest with the sparse address space (build_guest.py --sparse --chunk-shift 20 --reuse --split-index).
  G0Sparse:
    type: application
    platform: iOS
    sources:
      - G0.mm
      - e3/runtime.c
      - e3/entry.S
      - path: ../../generated/g0/e3/art-sparse/obj
        optional: true
        excludes: ["*.o"]
      - path: ../../generated/g0/e3/art-sparse/root
        optional: true
        type: folder
        buildPhase: resources
      - path: ../../generated/g0/e3/art-sparse/scripts-android.bin
        optional: true
        buildPhase: resources
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0sparse
        CODE_SIGN_ENTITLEMENTS: Extended.entitlements
        GCC_PREPROCESSOR_DEFINITIONS: "G0_GUEST=1 G0_ANDROID=1 GUEST_MAIN=guest_main SPARSE=1 CHUNK_SHIFT=20"
  # Embeds the generated code frameworks for E5.
  G0Code:
    type: application
    platform: iOS
    sources: [G0.mm]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.nestvane.g0code
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed generated code frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          for framework in "$G0_FRAMEWORKS"/G0Code*.framework; do
            rsync -a --delete "$framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none \
              "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/$(basename "$framework")"
          done
