<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Nestvane</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!--
    GitHub Pages serves this file for any missing address, however deep, so relative
    addresses cannot be relied on here. The styles are therefore inline, and the small
    script at the end points the icon and the link back at the site's own folder.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #faf7f2;
      --bg-raised: #ffffff;
      --text: #1b1920;
      --text-muted: #5a5564;
      --line-strong: #cfc6b7;
      --cyan: #0b7285;
      --magenta: #b01f7c;
      --orange: #b0500a;
      --violet: #6238c9;
      --focus: #6238c9;
      --glow-opacity: 0.38;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0a10;
        --bg-raised: #15131c;
        --text: #f3f1f7;
        --text-muted: #aaa5b8;
        --line-strong: #383444;
        --cyan: #56d9ea;
        --magenta: #f46cc4;
        --orange: #ffa552;
        --violet: #ad92ff;
        --focus: #56d9ea;
        --glow-opacity: 0.55;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 48px max(16px, 5vw);
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.6;
      text-align: center;
    }
    main { max-width: 34rem; }
    .icon { position: relative; width: 96px; height: 96px; margin: 0 auto 32px; }
    .icon::before {
      content: "";
      position: absolute;
      inset: -80%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 35%, var(--magenta), transparent 55%),
        radial-gradient(circle at 72% 40%, var(--cyan), transparent 55%),
        radial-gradient(circle at 45% 75%, var(--orange), transparent 50%),
        radial-gradient(circle at 65% 70%, var(--violet), transparent 55%);
      filter: blur(36px);
      -webkit-mask-image: radial-gradient(closest-side, #000 25%, transparent 100%);
      mask-image: radial-gradient(closest-side, #000 25%, transparent 100%);
      opacity: var(--glow-opacity);
    }
    .icon img { position: relative; display: block; width: 96px; height: 96px; border-radius: 22.5%; }
    .code {
      margin: 0 0 10px;
      color: var(--magenta);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
    p { margin: 16px 0 0; color: var(--text-muted); }
    .button {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 28px;
      padding: 10px 22px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      text-decoration: none;
    }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="icon"><img id="icon" src="assets/nestvane-icon.png" width="96" height="96" alt=""></div>
    <p class="code">Error 404</p>
    <h1>This page is not here.</h1>
    <p>The address may be mistyped, or the page may have moved.</p>
    <a class="button" id="home" href="./">Back to Nestvane</a>
  </main>
  <script>
    // Find the site's folder in the current address so the links work from any depth.
    (function () {
      var path = location.pathname;
      var at = path.indexOf("/nestvane/");
      if (at < 0) { return; }
      var root = path.slice(0, at + "/nestvane/".length);
      document.getElementById("home").setAttribute("href", root);
      document.getElementById("icon").setAttribute("src", root + "assets/nestvane-icon.png");
    })();
  </script>
</body>
</html>
